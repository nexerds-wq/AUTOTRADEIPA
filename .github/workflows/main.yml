name: Build Nexer Quant IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Find project
        run: |
          find . -name "*.xcodeproj" -print
          find . -name "*.swift" -print

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project NexerQuant.xcodeproj \
            -scheme NexerQuant \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Create Payload
        run: |
          mkdir -p Payload

          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -1)

          echo "Found app: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app was not found"
            exit 1
          fi

          cp -R "$APP_PATH" Payload/

      - name: Create IPA
        run: |
          zip -r NexerQuant.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexerQuant-Unsigned-IPA
          path: NexerQuant.ipa
          if-no-files-found: error
