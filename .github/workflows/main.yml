name: Build Nexer Quant IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project
        run: |
          pwd
          find . -maxdepth 3 -type f | sort
          xcodebuild -version
          xcodebuild -project NexerQuant.xcodeproj -list

      - name: Build Nexer Quant
        run: |
          set -o pipefail

          xcodebuild \
            -project NexerQuant.xcodeproj \
            -scheme NexerQuant \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            SUPPORTED_PLATFORMS=iphoneos \
            SUPPORTS_MACCATALYST=NO \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Find App
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos \
            -name "*.app" -type d -maxdepth 1 | head -1)

          echo "APP=$APP"

          if [ -z "$APP" ]; then
            echo "ERROR: Nexer Quant .app was not generated"
            find build -maxdepth 6 -type d -name "*.app" || true
            exit 1
          fi

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry NexerQuant.ipa Payload

          echo "IPA created:"
          ls -lh NexerQuant.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexerQuant-Unsigned-IPA
          path: NexerQuant.ipa
          if-no-files-found: error
